<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Links</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
    }
    p {
      color: #94a3b8;
      margin: 0 0 24px 0;
      font-size: 14px;
    }
    .btn {
      display: block;
      background: #334155;
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-weight: 500;
      transition: background 0.2s, transform 0.2s;
    }
    .btn:hover {
      background: #475569;
      transform: translateY(-2px);
    }
    .btn.topmate {
      background: #2563eb;
    }
    .btn.topmate:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect With Me</h1>
    <p>Check out my latest content and links</p>

    <!-- Replace '#' with your real URLs -->
    <a href="https://www.youtube.com/@CharanTejamangali" class="btn" target="_blank">YouTube Channel</a>
    <a href="https://www.youtube.com/@CharanTejaTelugu" class="btn" target="_blank">Telugu YouTube Channel</a>
    <a href="https://www.instagram.com/charanmangali6?igsi=MWszdWE1YmxiZGplbg==" class="btn" target="_blank">Instagram</a>
    <a href="https://topmate.io/charantejamangali/" class="btn topmate" target="_blank">Book 1:1 on Topmate</a>
  </div>
</body>
</html>
